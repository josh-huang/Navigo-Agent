[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigo_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/navigo_agent/**", "app.py", "backend.py", "templates/**", "static/**"]

[project]
name = "navigo-agent"
version = "0.1.0"
description = "AI-powered travel companion built on LangGraph multi-agent architecture"
authors = [
    { name = "josh-huang", email = "joshhuang1999@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-groq>=1.1",
    "langchain-community>=0.4",
    "langchain-tavily>=0.2",
    "langchain-mcp-adapters>=0.3",
    "psycopg[binary]>=3.3",
    "psycopg_pool>=3.3",
    "python-dotenv>=1.2",
    "tavily-python>=0.7",
    "requests>=2.34",
    "langgraph-checkpoint-postgres>=3.1",
    "airportsdata>=2026",
    "pycountry>=26.2",
    "fastapi>=0.136",
    "uvicorn>=0.48",
    "jinja2>=3.1",
    "mcp>=1.28",
    "aviationstack-mcp>=1.6.0",
    "starlette<1.6.0",
    "bleach>=6.4.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]
