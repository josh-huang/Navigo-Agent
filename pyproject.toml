[project]
name = "tripmate-ai"
version = "0.1.0"
description = "AI-powered travel companion built on LangGraph multi-agent architecture"
authors = [
    { name = "josh-huang", email = "joshhuang1999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-groq>=1.1",
    "langchain-community>=0.4",
    "langchain-tavily>=0.2",
    "langchain-mcp-adapters>=0.3",
    "psycopg[binary]>=3.3",
    "psycopg_pool>=3.3",
    "python-dotenv>=1.2",
    "tavily-python>=0.7",
    "requests>=2.34",
    "langgraph-checkpoint-postgres>=3.1",
    "airportsdata>=2026",
    "pycountry>=26.2",
    "fastapi>=0.136",
    "uvicorn>=0.48",
    "jinja2>=3.1",
    "nest_asyncio>=1.6",
    "mcp>=1.28",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
